<section class="page">
  <div class="hero retro-card">
    <h1 class="retro-title">Catalog</h1>
    <p class="sub">
      Browse the finest gadgets in the neon aisle. (If the backend product API isn’t available, a demo catalog appears.)
    </p>
  </div>

  <div class="retro-card" *ngIf="loading">Loading products…</div>
  <div class="retro-card" *ngIf="!loading && error">{{ error }}</div>

  <div class="retro-grid grid" *ngIf="!loading && !error">
    <article class="retro-card product" *ngFor="let p of products">
      <div class="badge">{{ p.category ?? 'Gadget' }}</div>
      <h2 class="name">{{ p.name }}</h2>
      <p class="desc">{{ p.description }}</p>

      <div class="row">
        <div class="price">{{ formatMoney(p.priceCents) }}</div>
        <div class="rating" *ngIf="p.rating">★ {{ p.rating.toFixed(1) }}</div>
      </div>

      <div class="actions">
        <a class="retro-btn" [routerLink]="['/product', p.id]">Details</a>
        <button class="retro-btn primary" (click)="addToCart(p)">Add to cart</button>
      </div>
    </article>
  </div>
</section>
